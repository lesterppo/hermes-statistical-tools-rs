[package]
name = "hermes-statistical-tools-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of lesterppo/hermes-statistical-tools: agent-native statistical tools, CSV in, compact JSON out"
license = "MIT"

[[bin]]
name = "hst"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
statrs = "0.18"
nalgebra = "0.33"

[profile.release]
opt-level = 3
